name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Points the built frontend at the deployed realtime-server.
          # Set this as a repository variable: Settings > Secrets and
          # variables > Actions > Variables > VITE_API_BASE_URL.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # GITHUB_REPOSITORY is set automatically by Actions ("owner/repo")
          # and is used by vite.config.ts to derive the "/repo/" base path
          # GitHub Pages project sites are served from. No manual setup
          # needed unless you want to override it — set a VITE_BASE_PATH
          # repository variable to do that.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
